# Configuración de SonarQube Cloud (SonarCloud).
sonar.organization=sando-07
sonar.projectKey=SANDO-07_transmetro
sonar.projectName=Transmetro

sonar.sources=app,routes,database/migrations,database/seeders
sonar.tests=tests
sonar.exclusions=vendor/**,storage/**,bootstrap/cache/**,resources/views/**
sonar.php.coverage.reportPaths=coverage.xml
sonar.php.tests.reportPath=junit.xml
sonar.sourceEncoding=UTF-8

# Quality gate: el análisis espera el resultado y falla el pipeline si no se cumple
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300
