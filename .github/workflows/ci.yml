name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PHP_VERSION: '8.4'
  COVERAGE_MIN: '60'

jobs:
  # ---------------------------------------------------------------- 1. BUILD
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: mbstring, pdo_mysql, pdo_sqlite
          coverage: none
      - name: Cachear dependencias de Composer
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
      - name: Instalar dependencias
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Validar composer.json y verificar que la aplicación arranca
        run: |
          composer validate --no-check-lock
          cp .env.example .env
          php artisan key:generate
          php artisan about --only=environment

  # ----------------------------------------------------------------- 2. TEST
  test:
    name: Test (unitarias, integración y regresión + cobertura)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: mbstring, pdo_mysql, pdo_sqlite
          coverage: pcov
      - name: Instalar dependencias
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Ejecutar pruebas con cobertura
        run: |
          cp .env.example .env
          php artisan key:generate
          vendor/bin/phpunit --coverage-clover=coverage.xml --coverage-text --log-junit=junit.xml
      - name: "Quality gate: cobertura mínima"
        run: php scripts/check-coverage.php coverage.xml ${{ env.COVERAGE_MIN }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: |
            coverage.xml
            junit.xml

  test-mysql:
    name: Test (reportes SQL sobre MySQL)
    needs: build
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: secret
          MYSQL_DATABASE: transmetro_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -psecret"
          --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: transmetro_test
      DB_USERNAME: root
      DB_PASSWORD: secret
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: mbstring, pdo_mysql
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: cp .env.example .env && php artisan key:generate
      - name: Pruebas de reportes en MySQL
        run: vendor/bin/phpunit --group mysql

  # --------------------------------------------------------------- 3. ANALYZE
  analyze:
    name: Analyze (linter, análisis estático y SonarCloud)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # SonarCloud necesita el historial completo
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: mbstring, pdo_mysql, pdo_sqlite
          coverage: none
      - name: Instalar dependencias
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: "Quality gate: estilo de código (Laravel Pint)"
        run: vendor/bin/pint --test
      - name: "Quality gate: análisis estático (Larastan)"
        run: |
          composer require --dev larastan/larastan --no-interaction --no-progress --no-scripts
          mkdir -p storage/framework/phpstan
          vendor/bin/phpstan analyse --memory-limit=512M --no-progress
      - uses: actions/download-artifact@v4
        with:
          name: test-reports
      - name: "Quality gate: SonarCloud"
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # ---------------------------------------------------------------- 4. REPORT
  report:
    name: Report (resumen de calidad)
    needs: [test, test-mysql, analyze]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: test-reports
      - name: Publicar resumen en la ejecución
        run: |
          {
            echo "## Resumen de calidad"
            echo ""
            echo "| Etapa | Resultado |"
            echo "|---|---|"
            echo "| Test | ${{ needs.test.result }} |"
            echo "| Test MySQL | ${{ needs.test-mysql.result }} |"
            echo "| Analyze | ${{ needs.analyze.result }} |"
            if [ -f coverage.xml ]; then
              echo ""
              php -r '$m=simplexml_load_file("coverage.xml")->project->metrics; printf("Cobertura de líneas: **%.2f%%**\n", (int)$m["coveredstatements"]*100/max(1,(int)$m["statements"]));'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Fallar si alguna etapa falló
        if: ${{ needs.test.result != 'success' || needs.test-mysql.result != 'success' || needs.analyze.result != 'success' }}
        run: exit 1
